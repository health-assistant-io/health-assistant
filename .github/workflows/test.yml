name: Reusable Test Suite

on:
  workflow_call:

jobs:
  test-backend:
    name: Run Backend Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg14
        env:
          POSTGRES_DB: neuronection_health_test
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_health_owner -d neuronection_health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      # The backend moved to uv in plan 20 (abebd80) but the runner never
      # got the binary — `uv sync`/`uv run` died with exit 127. Family
      # pattern (career/study ci.yml): astral-sh/setup-uv.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Lint & Type Check (ruff + mypy)
        # Same working directory/import root as the pytest steps below; the
        # lint gate needs no DB service. mypy is the documented ratchet over
        # app/core ([tool.mypy] files) — family pattern (study/auth-kit CI).
        run: |
          cd backend
          export PYTHONPATH="$(cd .. && pwd):$(pwd)"
          uv run ruff check .
          uv run mypy

      - name: Run Pytest Suite
        env:
          # Configure via parts (not DATABASE_URL) so config.py assembles the
          # URL and the b13 security-hygiene tests exercise POSTGRES_PASSWORD.
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: neuronection_health_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          # Mirror production Docker PYTHONPATH (/app/backend:/app) so the
          # top-level `integrations` package is importable during tests.
          export PYTHONPATH="$(cd .. && pwd):$(pwd)"
          uv run pytest
      - name: Contract drift gate (identity-auth §18)
        env:
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: neuronection_health_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          export PYTHONPATH="$(cd .. && pwd):$(pwd)"
          uv run pytest -m contract

  test-frontend:
    name: Run Frontend Lint & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Build Test
        run: |
          cd frontend
          npm run lint
          npm run build
