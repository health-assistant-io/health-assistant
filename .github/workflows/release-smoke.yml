name: Release install smoke

# Guards the one-line install on the PUBLISHED release (G4): the bootstrap
# resolves the tag, verifies the bundle's SHA-256 against SHA256SUMS,
# extracts the source-free bundle, the installer pins the release images
# (never `:latest`), writes .env at 0600, boots the real stack from the
# pinned images and waits for /health + /ready — and a re-run is a no-op
# that keeps .env byte-identical. `--dry-run` proves no writes happen.
#
# Ordering: release.yml creates the release as a DRAFT, uploads + verifies
# the assets against the draft, and only then publishes it — so when this
# workflow starts, the release and its assets became public together and
# releases/latest never 404s mid-release (audit §4a.3). The bounded asset
# wait in the first step stays as a guard for dispatch runs and for any
# publish path that does not follow that order.
#
# Triggers: a release published by the pipeline's GITHUB_TOKEN does not
# deliver `release` events to other workflows (GitHub's anti-recursion
# rule), so release.yml dispatches this workflow explicitly, by tag, as its
# final step. The `release: published` trigger below covers releases
# published outside the pipeline (a human or a PAT); workflow_dispatch
# covers the pipeline's dispatch and manual runs.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke-test (e.g. v0.10.3)
        required: true

# One smoke per tag: the pipeline dispatch and a human `release: published`
# for the same tag must not run two overlapping stacks.
concurrency:
  group: release-smoke-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Wait for the release assets (published with them, but guard anyway)
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" --json assets --jq '.assets[].name' \
                 | grep -qx "health-bootstrap-${TAG}.sh" \
               && gh release view "$TAG" --json assets --jq '.assets[].name' \
                 | grep -Eq '^health-compose-v[0-9].*\.tar\.gz$'; then
              echo "assets present (attempt ${attempt})"
              exit 0
            fi
            echo "waiting for the bundle + bootstrap assets (attempt ${attempt}/30)"
            sleep 20
          done
          echo "::error::release $TAG has no bootstrap/bundle assets after 10 minutes — did attach-release-artifacts run?"
          exit 1

      - name: Bootstrap resolves the tag and verifies the release checksums
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/ha-smoke"
          rm -rf "$DIR"; mkdir -p "$DIR"
          # The exact-tag asset knows its release from its own filename —
          # no API call — and prints the contract version for it.
          cp scripts/bootstrap.sh "$RUNNER_TEMP/health-bootstrap-${TAG}.sh"
          out="$(bash "$RUNNER_TEMP/health-bootstrap-${TAG}.sh" --version)"
          printf '%s\n' "$out"
          grep -q "bootstrap contract: " <<<"$out"
          grep -q "resolved release: ${TAG} (pinned by this file's name)" <<<"$out"

          # --dry-run: resolve, download, verify, print the hand-off — and
          # write NOTHING outside its temp dir.
          out="$(bash "$RUNNER_TEMP/health-bootstrap-${TAG}.sh" --dry-run --dir "$DIR")"
          printf '%s\n' "$out"
          grep -q "Dry run OK" <<<"$out"
          grep -q -- "--image backend=" <<<"$out"
          grep -q -- "--image frontend=" <<<"$out"
          [ ! -e "$DIR" ] || { echo "::error::--dry-run created the target dir"; exit 1; }
          echo "dry run wrote nothing into $DIR"

      - name: Install from the bundle (pins, .env 0600, real stack, /health + /ready)
        run: |
          set -euo pipefail
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          fi
          DIR="$RUNNER_TEMP/ha-smoke"
          mkdir -p "$DIR"
          # The real one-line flow: the exact-tag bootstrap installs the
          # extracted bundle and hands off to its own scripts/install.sh.
          # CI stdin is not a tty, so the APP_URL prompt takes its default.
          out="$(bash "$RUNNER_TEMP/health-bootstrap-${TAG}.sh" --dir "$DIR" -- --http-port 8080 --no-token)"
          printf '%s\n' "$out"
          grep -q "Handing off to the bundle's own installer" <<<"$out"

          cd "$DIR"
          # .env: generated at 0600, env setup-token mode, token stored (D12:
          # the one permitted storage), and NEVER printed by a --no-token run.
          [ "$(stat -c %a .env)" = "600" ] || { echo "::error::.env is not 0600"; exit 1; }
          grep -q '^SETUP_TOKEN_MODE=env$' .env
          grep -q '^SETUP_BOOTSTRAP_TOKEN=.\+$' .env
          grep -qE '^HA_BACKEND_IMAGE=.*@sha256:[0-9a-f]{64}$' .env
          grep -qE '^HA_FRONTEND_IMAGE=.*@sha256:[0-9a-f]{64}$' .env
          grep -q "token=" <<<"$out" \
            && { echo "::error::--no-token still printed a setup token"; exit 1; } \
            || echo "no setup token in the install output (--no-token)"
          grep -q "Ready:    http://127.0.0.1:8080/ready" <<<"$out"
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status"'
          curl -fsS http://127.0.0.1:8080/ready  | grep -q '"ready"'

          # The rendered stack must never fall back to a mutable ref.
          docker compose --env-file .env -f docker/docker-compose.standalone.yml config \
            | grep -E '^[[:space:]]+image:' | sort -u | tee "$RUNNER_TEMP/images.txt"
          grep -qE '@sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/images.txt"
          if grep -qE ':latest(:|@|$)' "$RUNNER_TEMP/images.txt"; then
            echo "::error::rendered stack still uses :latest — a release install must pin its images"
            exit 1
          fi
          if grep -qE ':main(:|@|$)' "$RUNNER_TEMP/images.txt"; then
            echo "::error::rendered stack uses :main — never a branch ref"
            exit 1
          fi

      - name: Re-run is a no-op that keeps .env
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ha-smoke"
          BEFORE="$(sha256sum .env | awk '{print $1}')"
          out="$(bash scripts/install.sh --http-port 8080 --no-token)"
          printf '%s\n' "$out"
          AFTER="$(sha256sum .env | awk '{print $1}')"
          [ "$BEFORE" = "$AFTER" ] || { echo "::error::re-run rewrote .env"; exit 1; }
          echo "re-run kept .env byte-identical and refreshed the stack"

      - name: Tear the smoke stack down
        if: always()
        run: |
          cd "$RUNNER_TEMP/ha-smoke" 2>/dev/null || exit 0
          docker compose --env-file .env -f docker/docker-compose.standalone.yml down -v >/dev/null 2>&1 || true

      - name: Published images exist for this tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          fi
          for image in backend frontend; do
            ref="ghcr.io/health-assistant-io/health-assistant/health-assistant-${image}:${version}"
            attempt=1
            while [ "$attempt" -le 30 ]; do
              if docker manifest inspect "$ref" >/dev/null 2>&1; then
                echo "ok: ${image}:${version}"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "::error::${ref} is still missing after 30 minutes — docker-publish failed or was skipped"
                exit 1
              fi
              echo "waiting for ${ref} (attempt ${attempt}/30)"
              attempt=$((attempt + 1))
              sleep 60
            done
          done
