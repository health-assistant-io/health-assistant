name: Security Scan

on:
  push:
    branches: ["main", "security/*"]
  pull_request:
  schedule:
    # Weekly (Monday 06:00 UTC) — catches newly-published advisories in
    # pinned dependencies even when the code hasn't changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependency-scan:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The runner image has no uv binary — `uv pip install` died with
      # exit 127. Same fix as test.yml (dbc5b02); family pattern
      # (career/study ci.yml): astral-sh/setup-uv.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: uv pip install --system pip-audit
      - name: Audit backend requirements
        working-directory: backend
        # `neuronection-auth-kit` is a SHA-pinned family VCS dependency, not a
        # PyPI package: pip-audit cannot audit it and `--strict` treats that
        # as a failure. Filter that one line so the PyPI surface is audited
        # strictly instead of the step dying on the family pin. Export without
        # hashes for the same reason (pip cannot hash a VCS requirement).
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes > /tmp/reqs.txt
          grep -v '^neuronection-auth-kit' /tmp/reqs.txt > /tmp/reqs-pypl.txt
          pip-audit -r /tmp/reqs-pypl.txt --no-deps --strict

  frontend-dependency-scan:
    name: pnpm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts </dev/null
      - name: pnpm audit (production, zero tolerance)
        working-directory: frontend
        # The shipped surface is the runtime dependency set. Kept blocking:
        # a moderate+ advisory in a production dependency fails the release.
        run: pnpm audit --prod --audit-level=moderate
      - name: pnpm audit (dev/build tooling, informational)
        working-directory: frontend
        # Dev/build tooling advisories (glob/minimatch via vite-plugin-pwa and
        # @typescript-eslint) do not ship in the frontend artifact. Keep them
        # visible without blocking a release on a toolchain upgrade; the
        # 0.9.1 backlog tracks the majors needed to clear them.
        continue-on-error: true
        run: pnpm audit --dev --audit-level=moderate

  secret-history-scan:
    name: gitleaks (repo history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2 aborts on org-owned repos without a
      # GITLEAKS_LICENSE key ([health-assistant-io] is an organization.
      # License key is required.) and the secret was never set. Direct
      # binary instead — family pattern (auth-kit ci.yml, career/study
      # gitleaks.yml): full history via fetch-depth 0, repo config,
      # --redact, no license needed.
      - name: Run gitleaks (working tree + full history)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact -v --config .gitleaks.toml
