name: Family convergence

# Family-convergence gate (plan 20 D9 / reference-architecture.md) — tool
# config parity, prefixed-only env, migrations home, no legacy markers,
# packaging shape, contract gates. Script must stay byte-identical across
# family repos (sha-checked by the family wiring verifier).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/check-family-convergence.sh'
      - 'scripts/check-no-legacy.sh'
      - '.github/workflows/family-convergence.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'docker/**'
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/check-family-convergence.sh'
      - 'scripts/check-no-legacy.sh'
      - '.github/workflows/family-convergence.yml'
  workflow_dispatch:

jobs:
  converge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate self-test (plan 23 D4)
        run: bash scripts/check-family-convergence.selftest.sh
      - name: Extension structure probe (blocking, plan 32 Phase 9)
        run: bash scripts/check-extensions-structure.sh --strict
      - name: Run family-convergence gate
        run: bash scripts/check-family-convergence.sh --self

  no-legacy-extras:
    name: No-legacy extras (plan 9 W6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Gate self-test (planted red hosts)
        run: bash scripts/check-no-legacy.sh --self-test
      - name: Run the repo-specific no-legacy gate
        run: bash scripts/check-no-legacy.sh

  extension-conformance:
    name: Extension conformance wall (ADR-0040)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # This wall imports the app, so conftest runs the migrations: it needs the
    # same database + cache services as the test workflow (the job previously
    # failed on `connection to server at "localhost" ... refused`).
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: neuronection_health_test
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuronection_health_owner -d neuronection_health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --frozen
      - name: Run the vendored contract fixtures + semantics
        working-directory: backend
        env:
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: neuronection_health_test
          REDIS_URL: redis://localhost:6379
        run: uv run --frozen pytest tests/test_extensions_contract.py -q
