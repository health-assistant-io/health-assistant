name: Create GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release from (e.g. v0.3.0-rc.2)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    # Release creation is the only write surface at this stage; the workflow
    # defaults to contents: read (job-level least privilege).
    permissions:
      contents: write
    outputs:
      # attach-release-artifacts needs the classification when publishing:
      # a prerelease must never take the releases/latest alias.
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        # Dispatch input passed via env (never interpolated into the script)
        # — anti script-injection pattern.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Creating release for tag: $TAG"

      - name: Determine prerelease status
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Pre-release suffixes: -rc.N, -beta, -alpha, -pre, -dev
          if [[ "$TAG" =~ -(rc|beta|alpha|pre|dev)(\.|$) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Strip the leading 'v' to match the CHANGELOG version format (0.3.0-rc.2 not v0.3.0-rc.2)
          VERSION="${TAG#v}"

          # Extract the section for this version from CHANGELOG.md.
          # Matches: ## [VERSION] - YYYY-MM-DD  ... up to the next ## [ header.
          # The changelog convention carries a leading `v` (`## [v0.9.0]`), so
          # match both forms — the original single-form match silently produced
          # a one-line stub for every release.
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture=0 }
            /^## \[/ {
              if (capture) exit
              if (index($0, "[" ver "]") > 0 || index($0, "[v" ver "]") > 0) { capture=1; next }
            }
            capture { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG section found for ${TAG} (tried [$VERSION] and [v$VERSION]) — refusing to publish a stub release body."
            exit 1
          fi

          # Write to a file to preserve multi-line content in the action output.
          echo "$NOTES" > /tmp/release_notes.md
          echo "Extracted notes for version $VERSION ($(wc -l < /tmp/release_notes.md) lines)"

      # DRAFT-FIRST PUBLISHING (the `latest`-alias race, audit §4a.3): a
      # release published before its bundle/bootstrap assets are uploaded
      # becomes releases/latest while its assets are still missing, so the
      # one-liner 404s for the whole upload window. The release is therefore
      # created as a DRAFT (drafts never take the alias; make_latest:false
      # is belt-and-braces), attach-release-artifacts uploads and verifies
      # every asset against the invisible draft, and that job's final step
      # is the ONLY moment the release is published. Any failure on the way
      # leaves the release a draft and releases/latest still pointing at
      # the previous release — never a half-empty public one.
      - name: Create the release as a draft (assets attach before publish)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: /tmp/release_notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          draft: true
          make_latest: false
          generate_release_notes: false

  # Family-pattern release gate (career-assistant release.yml): the release
  # assets are only built after the tag's OWN image publish pipeline has
  # finished green — the manifest embeds the exact digests that pipeline
  # pushed, so a release must never race it.
  #
  # Timeout posture (the 2026-11 release-reliability fix): the wait deadline
  # is 60 minutes inside a 75-minute job ceiling. The v0.10.0 tag build ran
  # ~16 minutes; the backend/contract/conformance suites it re-runs can
  # stretch well past that on a cold cache or a busy queue. A slow-but-green
  # pipeline can therefore never fail a release spuriously: only a real red
  # conclusion (or the explicit deadline) stops the gate.
  ci-gate:
    name: CI gate (same SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.gate.outputs.run_id }}
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for the image publish pipeline on this exact commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          # Dispatched runs may target an older tag: always gate on the commit
          # the TAG points at, never on the workflow's checkout SHA (which for
          # workflow_dispatch is the default branch head).
          SHA="$(git rev-parse "${TAG}^{commit}")"
          echo "CI gate: tag=$TAG commit=$SHA"

          DEADLINE=$(( $(date +%s) + 60 * 60 ))   # 60 min of waiting
          ATTEMPT=0
          while :; do
            ATTEMPT=$((ATTEMPT + 1))
            RUN="$(gh api "repos/${GH_REPO}/actions/workflows/docker-publish.yml/runs?head_sha=${SHA}&per_page=1")"
            RUN_ID="$(jq -r '.workflow_runs[0].id // ""' <<<"$RUN")"
            STATUS="$(jq -r '.workflow_runs[0].status // ""' <<<"$RUN")"
            CONCLUSION="$(jq -r '.workflow_runs[0].conclusion // ""' <<<"$RUN")"
            NOW="$(date +%s)"

            if [ "$CONCLUSION" = "success" ]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "CI gate passed: Docker Build and Publish succeeded for $SHA (run ${RUN_ID})"
              exit 0
            fi

            case "$CONCLUSION" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Docker Build and Publish concluded '${CONCLUSION}' for $SHA — refusing to attach release artifacts whose manifest would name images that never published."
                exit 1
                ;;
              skipped)
                echo "::error::Docker Build and Publish was skipped for $SHA — no images exist for this tag; the release manifest cannot be built."
                exit 1
                ;;
            esac

            if [ "$NOW" -ge "$DEADLINE" ]; then
              echo "::error::No completed Docker Build and Publish run for $SHA within 60 minutes (last status: '${STATUS:-not visible}'). The tag build may still be queued — re-run this workflow once it finishes green instead of shipping a manifest without digests."
              exit 1
            fi

            echo "waiting for Docker Build and Publish on $SHA (attempt ${ATTEMPT}, status: ${STATUS:-not visible yet}, $(( (DEADLINE - NOW) / 60 )) min of budget left)"
            sleep 60
          done

  # Attach the deployment artifacts to the release created above:
  #   health-compose-v<version>.tar.gz — source-free compose bundle
  #   manifest.json                    — schemaVersion 2: product/version/tag/
  #                                      commit + BOTH image digest refs +
  #                                      bundle SHA + per-file SHA256SUMS
  #   SHA256SUMS                       — release-level checksums (bundle +
  #                                      manifest + the two bootstrap assets)
  #   health-bootstrap-v<version>.sh  — the generated one-line bootstrap,
  #                                      exact-tag form
  #   health-bootstrap.sh              — version-free alias for
  #                                      releases/latest/download (what
  #                                      neuronection.com/install/health.sh
  #                                      and health-assistant.io/install.sh
  #                                      redirect to)
  #
  # The release is a DRAFT while all of the above is uploaded and verified;
  # the last two steps of this job then (1) publish it — the only moment it
  # becomes releases/latest, with every asset already attached — and
  # (2) dispatch the release smoke on the published tag. A failure anywhere
  # earlier leaves the release a draft: no 404 window on the one-liner.
  attach-release-artifacts:
    name: Attach compose bundle to the release
    needs: [create-release, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # write covers read: dispatching the post-publish smoke AND
      # downloading the image-digests artifact from the publish run.
      actions: write
      contents: write # upload assets to the draft release, then publish it
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download the image digests from the publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.ci-gate.outputs.run_id }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/digests"
          # Cross-workflow artifact download (gh resolves run → artifacts).
          if ! gh run download "$RUN_ID" -n image-digests -D "$RUNNER_TEMP/digests"; then
            echo "::error::The publish run ${RUN_ID} has no 'image-digests' artifact — it predates the digest-exposing docker-publish workflow. Re-run Docker Build and Publish for this tag, then re-run this workflow."
            exit 1
          fi
          cat "$RUNNER_TEMP/digests/image-digests.json"

      - name: Build the source-free compose bundle
        env:
          TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          set -euo pipefail
          DIGESTS="$RUNNER_TEMP/digests/image-digests.json"
          SHA="$(git rev-parse "${TAG}^{commit}")"
          scripts/build-deploy-bundle.sh \
            --version "${TAG#v}" \
            --commit "$SHA" \
            --backend-image "$(jq -r '.images.backend.ref + "@" + .images.backend.digest' "$DIGESTS")" \
            --frontend-image "$(jq -r '.images.frontend.ref + "@" + .images.frontend.digest' "$DIGESTS")" \
            --output-dir "$RUNNER_TEMP/release"

      # scripts/bootstrap.sh is GENERATED from the family installer
      # contract's template (never hand-written here). The exact-tag asset
      # and the version-free alias are the same bytes: the alias is what
      # neuronection.com/install/health.sh and the health-assistant.io
      # compatibility redirect point at (releases/latest/download/), the
      # versioned form is the reproducible one the docs show.
      - name: Stage bootstrap assets and refresh SHA256SUMS
        env:
          TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -f scripts/bootstrap.sh ]; then
            cp scripts/bootstrap.sh "$RUNNER_TEMP/release/health-bootstrap-${TAG}.sh"
            cp scripts/bootstrap.sh "$RUNNER_TEMP/release/health-bootstrap.sh"
            (
              cd "$RUNNER_TEMP/release"
              sha256sum health-compose-*.tar.gz manifest.json \
                        "health-bootstrap-${TAG}.sh" health-bootstrap.sh > SHA256SUMS
              sha256sum -c SHA256SUMS
            )
            echo "Staged health-bootstrap-${TAG}.sh + the health-bootstrap.sh alias"
          else
            echo "::error::scripts/bootstrap.sh is missing — a contract release must attach the generated bootstrap."
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          set -euo pipefail
          # --clobber: re-running the workflow replaces stale assets instead of
          # failing on an existing filename.
          gh release upload "$TAG" \
            "$RUNNER_TEMP/release/health-compose-"*.tar.gz \
            "$RUNNER_TEMP/release/manifest.json" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/health-bootstrap-${TAG}.sh" \
            "$RUNNER_TEMP/release/health-bootstrap.sh" \
            --clobber
          echo "Attached compose bundle, manifest, SHA256SUMS and the bootstrap assets to release $TAG"

      - name: Publish the release (all assets attached and verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.ci-gate.outputs.tag }}
          IS_PRERELEASE: ${{ needs.create-release.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          # This is the ONLY moment the release becomes public. It is a draft
          # right now, so releases/latest still points at the previous
          # release and the one-liner never 404'd while these assets were
          # uploading. Everything above (digest download, bundle build,
          # staged SHA256SUMS verification, asset upload) has run green to
          # get here; a failure anywhere earlier simply left the release a
          # draft.
          if [ "$IS_PRERELEASE" = "true" ]; then
            # Prereleases never take the releases/latest alias.
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "Published release $TAG — releases/latest now resolves to it with all assets attached."

      - name: Trigger the release smoke on the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.ci-gate.outputs.tag }}
        run: |
          set -euo pipefail
          # Releases published by a workflow's GITHUB_TOKEN do not deliver
          # `release` events to other workflows (GitHub's anti-recursion
          # rule), so the `release: published` trigger in release-smoke.yml
          # never fires for a pipeline publish. Dispatch it explicitly, by
          # tag, now that the release is live with its assets.
          # Non-fatal by design: the release is already published and
          # latest — a missing smoke workflow on this ref must not fail the
          # release; run the smoke manually (workflow_dispatch, tag) instead.
          if gh workflow run release-smoke.yml --ref "$TAG" -f tag="$TAG"; then
            echo "Dispatched release-smoke.yml for $TAG (the post-publish G4 gate)."
          else
            echo "::warning::could not dispatch release-smoke.yml for $TAG — it may not exist on this ref yet. Run it manually (workflow_dispatch, tag=$TAG)."
          fi
