# Health Assistant (core) — version manager config (family-unified script)
# Family-unified script — do not fork; keep it in sync with the family standards

[project]
name = "Health Assistant"

[version]
file = "backend/app/core/config.py"
pattern = 'VERSION:\s*str\s*=\s*"(?P<version>[^"]+)"'

[[propagate]]
name = "Frontend package.json"
file = "frontend/package.json"
type = "json"
field = "version"

[[propagate]]
name = "README version badge"
file = "README.md"
type = "regex"
pattern = '(img\.shields\.io/badge/version-v)(?P<version>[^-\)]+)(--?[^-\)]*)?(-blue\.svg)'
template = '\g<1>{version}\g<4>'
dash_escape = true

[release]
docs = ["CHANGELOG.md"]
tag_prefix = "v"
