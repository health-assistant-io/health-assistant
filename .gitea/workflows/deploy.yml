name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
      - test
  workflow_dispatch:

# One pipeline per branch at a time; a newer push cancels any stale run so a
# superseded commit never reaches production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token scopes. Registry pushes authenticate with the
# REGISTRY_TOKEN PAT (docker/login-action), not the workflow token.
permissions:
  contents: read
  packages: write

env:
  # Completely secure: these values are pulled from Gitea Secrets at runtime
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  REPOSITORY: ${{ github.repository_owner }}
  # Branch-aware deployment topology. The `test` branch deploys a fully
  # separate stack on the same host: distinct deploy path, host ports,
  # container-name prefix (STACK_NAME), and floating image tag. TEST_*
  # secrets supply the test topology; the production stack is untouched.
  # Fallbacks are distinct per branch so a missing secret can't silently
  # reuse a production port and collide.
  STACK_NAME: ${{ github.ref_name == 'test' && 'health-assistant-test' || 'health-assistant' }}
  IMAGE_TAG_FLOATING: ${{ github.ref_name == 'test' && 'test' || 'latest' }}
  DEPLOY_PATH: ${{ github.ref_name == 'test' && (secrets.TEST_DEPLOY_PATH || '/home/deploy/health_assistant_test') || (secrets.DEPLOY_PATH || '/home/deploy/health_assistant') }}
  BACKEND_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_BACKEND_PORT || '8001') || (secrets.BACKEND_PORT || '8000') }}
  FRONTEND_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_FRONTEND_PORT || '3001') || (secrets.FRONTEND_PORT || '3000') }}
  FLOWER_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_FLOWER_PORT || '5556') || (secrets.FLOWER_PORT || '5555') }}
  POSTGRES_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_POSTGRES_PORT || '5433') || (secrets.POSTGRES_PORT || '5432') }}
  REDIS_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_REDIS_PORT || '6380') || (secrets.REDIS_PORT || '6379') }}

jobs:
  test-backend:
    name: Run Backend Pytest Suite
    runs-on: ubuntu-latest
    # NOTE: no `services:` block. Gitea act_runner v0.6.x runs every job inside
    # a container (docker.gitea.com/runner-images:ubuntu-latest) and does NOT
    # add service-name DNS aliases for `services:` containers — their actual
    # container names are opaque GITEA-ACTIONS-TASK-… IDs, so neither
    # "postgres" nor "localhost" resolves from the job container. Instead we
    # start postgres + redis via `docker run` (the Docker socket is mounted in
    # the job container) on the job's OWN network with explicit
    # --network-alias, which makes them reliably resolvable by name.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: uv.lock

      # The backend moved to uv in plan 20 (abebd80) but the runner image
      # ships no uv binary — `uv sync` died with `uv: command not found`
      # (exit 127) since run #167. Gitea twin of the GitHub-side plan 23 F1
      # fix (dbc5b02); family pattern (career/study ci.yml): setup-uv.
      # v7 (node24-declared) verified safe on the runner 2026-10-08: the
      # pulled docker.gitea.com/runner-images:ubuntu-latest
      # (sha256:0e62e56b…) ships node 24.19.0 as the PATH default, and
      # act_runner v0.6.1 executes every JS action with plain PATH `node`
      # regardless of the declared major — v5 was already running on v24.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Start database services on the job network
        run: |
          set -euo pipefail
          # Clean up any orphans from a previous (crashed) run — act_runner
          # does not reap manually-started sibling containers.
          docker rm -f ha-test-postgres ha-test-redis 2>/dev/null || true

          # Discover the job container's Docker network (the network act_runner
          # created for this job). `hostname` inside the container is the
          # container's short ID; the Docker socket is mounted so we can
          # inspect ourselves + attach siblings to the same network.
          JOB_CID="$(cat /etc/hostname)"
          JOB_NET="$(docker inspect "$JOB_CID" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' \
            | head -n1)"
          echo "Job container: $JOB_CID  Network: $JOB_NET"
          echo "JOB_NET=$JOB_NET" >> "$GITHUB_ENV"

          docker run -d --rm \
            --name ha-test-postgres \
            --network "$JOB_NET" \
            --network-alias postgres \
            -e POSTGRES_DB=neuronection_health_test \
            -e POSTGRES_USER=neuronection_health_owner \
            -e POSTGRES_PASSWORD=password \
            timescale/timescaledb:latest-pg14

          docker run -d --rm \
            --name ha-test-redis \
            --network "$JOB_NET" \
            --network-alias redis \
            redis:7-alpine

          echo "Waiting for postgres to accept connections…"
          for i in $(seq 1 30); do
            if docker exec ha-test-postgres pg_isready -U neuronection_health_owner -d neuronection_health_test >/dev/null 2>&1; then
              echo "postgres is ready"
              break
            fi
            sleep 2
          done

      - name: Install Backend Dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run Pytest Suite
        env:
          # Configure via parts (not DATABASE_URL) so config.py assembles the
          # URL and the b13 security-hygiene tests exercise POSTGRES_PASSWORD.
          # postgres + redis are reached by their --network-alias names set
          # above (resolvable on the job's Docker network).
          POSTGRES_USER: neuronection_health_owner
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: neuronection_health_test
          REDIS_URL: redis://redis:6379
        run: |
          cd backend
          # Mirror production Docker PYTHONPATH (/app/backend:/app) so the
          # top-level `integrations` package is importable during tests.
          export PYTHONPATH="$(cd .. && pwd):$(pwd)"
          uv run pytest

      - name: Stop database services
        if: always()
        run: docker rm -f ha-test-postgres ha-test-redis 2>/dev/null || true

  test-frontend:
    name: Run Frontend Lint & Build Test
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Build Test
        run: |
          cd frontend
          npm run lint
          npm run build

  # Gitea 28.1.0 (server upgraded 2026-10-08) rejects the `secrets` context
  # in job-level `if:` at workflow-parse time ("Unrecognized named-value:
  # 'secrets'") — GitHub's context-availability table never allowed it
  # there either. The registry/deploy enable-decisions therefore move into
  # this tiny gate job: step `env:` may read secrets everywhere, and the
  # downstream jobs test the published booleans via `needs`, which IS
  # allowed in job-level `if`.
  deploy-config:
    name: Deployment Config Gate
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    outputs:
      registry: ${{ steps.check.outputs.registry }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Check which secrets are configured
        id: check
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          VM_HOST: ${{ secrets.VM_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$REGISTRY_HOST" ] && [ -n "$REGISTRY_TOKEN" ]; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$VM_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend, deploy-config]
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    if: needs.deploy-config.outputs.registry == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Registry and Repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ env.REPOSITORY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOWER }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }} # Personal Access Token with package write/read permissions

      - name: Build and Push Backend
        run: |
          docker build -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ env.IMAGE_TAG_FLOATING }} -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ github.sha }} -f docker/Dockerfile .
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ env.IMAGE_TAG_FLOATING }}
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ github.sha }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ env.IMAGE_TAG_FLOATING }} -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ env.IMAGE_TAG_FLOATING }}
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Target Server
    needs: [build-and-push, deploy-config]
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    if: needs.deploy-config.outputs.deploy == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Registry and Repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ env.REPOSITORY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare Deployment Directory via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Copy Compose and Database Init Configs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          source: "docker/docker-compose.standalone.yml,docker/init-db.sql,docker/init-roles.sh,docker/nginx.conf"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy Stack and Run Migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script: |
            # Enable strict error tracking (Exit on any error/undefined-variable/pipeline-failure)
            set -euo pipefail
            
            cd ${{ env.DEPLOY_PATH }}
            
            # Log in to registry on the target server
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY_LOWER }} -u ${{ github.actor }} --password-stdin
            
            # Write environmental configs using secrets stored in Gitea Repo Settings
            cat << 'EOF' > .env
            REGISTRY=${{ env.REGISTRY_LOWER }}
            REPOSITORY=${{ env.REPOSITORY_LOWER }}
            IMAGE_TAG=${{ github.sha }}
            STACK_NAME=${{ env.STACK_NAME }}
            
            # Application
            DEBUG=false
            # Single source of truth: the APP_URL secret is the canonical
            # public origin users type in the browser. FRONTEND_URL and
            # HTTP_PORT are OPTIONAL overrides for the fronted-by-another-
            # proxy topology (TLS proxy on :443 -> gateway on :8090):
            #   - FRONTEND_URL unset -> same origin as APP_URL (single-origin
            #     gateway, the common case). Set it to a SECOND public origin
            #     (e.g. the direct http address) to add that host to the
            #     TrustedHost allowlist and CORS list.
            #   - HTTP_PORT is derived from APP_URL's port part below; set the
            #     secret only when a front proxy publishes the canonical port
            #     and the gateway itself publishes a different one.
            # Production validates the Host header against these (audit
            # 2026-08 CFG-L1); they also drive CORS and the OAuth issuer.
            # With a front proxy hop, also set HA_TRUSTED_PROXY_COUNT=2.
            APP_URL=${{ secrets.APP_URL || 'http://localhost' }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL || secrets.APP_URL || 'http://localhost' }}
            # Per-purpose key family (identity-auth §8, plan 16 H4). The
            # single all-purpose SECRET_KEY is retired from all signing.
            HA_SESSION_KEY=${{ secrets.HA_SESSION_KEY }}
            HA_REFRESH_KEY=${{ secrets.HA_REFRESH_KEY }}
            # Fernet at-rest key (legacy secret name still feeds it).
            HA_DATA_KEY=${{ secrets.HA_DATA_KEY }}
            HA_DATA_KEY_PREVIOUS=${{ secrets.HA_DATA_KEY_PREVIOUS }}
            # Default 1h since the 2026-08 security audit (was 24h).
            JWT_EXPIRATION_HOURS=${{ secrets.JWT_EXPIRATION_HOURS || '1' }}
            # Reverse-proxy chain depth for rate-limit identity (audit 2026-08
            # AUTH-H1). This stack fronts the backend with a host proxy on
            # 127.0.0.1, so exactly 1 trusted hop.
            HA_TRUSTED_PROXY_COUNT=${{ secrets.HA_TRUSTED_PROXY_COUNT || '1' }}
            
            # PostgreSQL Secrets
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'neuronection_health' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'neuronection_health_owner' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            
            # Redis Secrets
            REDIS_PORT=${{ env.REDIS_PORT }}
            # REQUIRED (audit 2026-08 CFG-M1): Redis runs with requirepass and
            # the compose file refuses to start without this. Set the
            # REDIS_PASSWORD repo secret before the next deploy.
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            
            # Ports exposed by container
            BACKEND_PORT=${{ env.BACKEND_PORT }}
            FRONTEND_PORT=${{ env.FRONTEND_PORT }}
            FLOWER_PORT=${{ env.FLOWER_PORT }}
            # Gateway published port — filled in from APP_URL right after the
            # heredoc (derived, not a separate secret).
            HTTP_PORT=
            FLOWER_USER=${{ secrets.FLOWER_USER || 'admin' }}
            FLOWER_PASSWORD=${{ secrets.FLOWER_PASSWORD }}
            
            # Host/Interface Binds
            BACKEND_BIND=${{ secrets.BACKEND_BIND || '127.0.0.1' }}
            FRONTEND_BIND=${{ secrets.FRONTEND_BIND || '127.0.0.1' }}
            FLOWER_BIND=${{ secrets.FLOWER_BIND || '127.0.0.1' }}
            
            # AI / OCR API Key and Model Customization
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
            OCR_PROVIDER=${{ secrets.OCR_PROVIDER || 'openai' }}
            
            # SMTP Secrets (optional)
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM || 'noreply@health-assistant.local' }}

            # Web Push (VAPID) — required in production or the app refuses to boot
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_ADMIN_EMAIL=${{ secrets.VAPID_ADMIN_EMAIL || 'admin@healthassistant.local' }}
            EOF
            
            # Gateway published port: the optional HTTP_PORT secret wins
            # (front-proxy topology, where the canonical port lives on the
            # proxy), else derived from APP_URL's port part (80/443 by
            # scheme).
            PUBLIC_ORIGIN="${{ secrets.APP_URL || 'http://localhost' }}"
            HTTP_PORT_DERIVED="$(printf '%s' "$PUBLIC_ORIGIN" | sed -nE 's|.*:([0-9]+)/?$|\1|p')"
            if [ -z "$HTTP_PORT_DERIVED" ]; then
                case "$PUBLIC_ORIGIN" in
                    https://*) HTTP_PORT_DERIVED="443" ;;
                    *)         HTTP_PORT_DERIVED="80"  ;;
                esac
            fi
            if [ -n "${{ secrets.HTTP_PORT }}" ]; then
                HTTP_PORT_DERIVED="${{ secrets.HTTP_PORT }}"
            fi
            sed -i "s|^HTTP_PORT=.*$|HTTP_PORT=${HTTP_PORT_DERIVED}|" .env

            # 1. Pull new images explicitly BEFORE bringing down active containers
            # This prevents downtime if network or authentication fails during pull!
            echo "Pulling new Docker images..."
            docker compose -f docker-compose.standalone.yml pull
            
            # 2. Stop old containers and start new ones
            echo "Restarting application stack..."
            # Pre-flight (2026-10-07 outage class): PostgreSQL data dirs are
            # incompatible across major versions. If the existing postgres
            # volume was initialized by a different major than the compose
            # image pins, a new container crash-loops ("database files are
            # incompatible with server") — abort BEFORE `down` so a stale
            # volume can never stop a running stack and leave a crash-loop
            # in its place. Migration path: docker/README.md → "Upgrading
            # from pg14" (dump with the OLD major's image → fresh volume →
            # restore). Covers both the STACK_NAME volume and a legacy
            # basename-project volume not yet adopted by the block below.
            STACK_PROJECT="$(grep -E '^STACK_NAME=' .env | head -n1 | cut -d= -f2- || true)"
            STACK_PROJECT="${STACK_PROJECT:-health-assistant}"
            TSIMG="$(grep -E '^[[:space:]]*image:[[:space:]]*timescale/timescaledb' docker-compose.standalone.yml | head -n1 | awk '{print $2}')"
            PG_MAJOR_IMG="${TSIMG##*-pg}"
            for PG_VOL in "${STACK_PROJECT}_postgres_data" "$(basename "$PWD")_postgres_data"; do
                docker volume inspect "$PG_VOL" >/dev/null 2>&1 || continue
                PG_VERSION_VOL="$(docker run --rm --entrypoint sh \
                    -v "${PG_VOL}:/pgdata:ro" "$TSIMG" \
                    -c 'cat /pgdata/PG_VERSION' 2>/dev/null || true)"
                if [ -n "$PG_VERSION_VOL" ] && [ "$PG_VERSION_VOL" != "$PG_MAJOR_IMG" ]; then
                    echo "CRITICAL: postgres volume ${PG_VOL} is PG v${PG_VERSION_VOL}, but the stack image is ${TSIMG} (v${PG_MAJOR_IMG})."
                    echo "Major versions cannot open each other's data directories — the new postgres would crash-loop, not migrate."
                    echo "Refusing to touch the running stack. Migrate first (dump with a v${PG_VERSION_VOL} image, recreate the volume,"
                    echo "restore) — see docker/README.md 'Upgrading from pg14'. The stack was left untouched."
                    exit 1
                fi
            done
            # One-time migration: before docker-compose.standalone.yml pinned the
            # top-level `name:` (= STACK_NAME), the compose project was the
            # deploy-dir basename (health_assistant / health_assistant_test).
            # Stop that legacy project first and copy its volumes under the
            # STACK_NAME project name, or `up` below would collide on
            # container names / start on empty volumes. Docker has no
            # `volume rename`, so the copy runs in the stack's own Postgres
            # image with the compose labels pre-applied. Idempotent: after
            # the first migration there is nothing legacy to find, and when
            # the basename already equals STACK_NAME the block is skipped.
            LEGACY_PROJECT="$(basename "$PWD")"
            NEW_PROJECT="$(grep -E '^STACK_NAME=' .env | head -n1 | cut -d= -f2- || true)"
            NEW_PROJECT="${NEW_PROJECT:-health-assistant}"
            if [ "$LEGACY_PROJECT" != "$NEW_PROJECT" ]; then
                docker compose -p "$LEGACY_PROJECT" -f docker-compose.standalone.yml down --remove-orphans
                for VOL in postgres_data redis_data uploads; do
                    docker volume inspect "${LEGACY_PROJECT}_${VOL}" >/dev/null 2>&1 || continue
                    docker volume inspect "${NEW_PROJECT}_${VOL}" >/dev/null 2>&1 && continue
                    if [ -n "$(docker ps -q --filter "volume=${LEGACY_PROJECT}_${VOL}")" ]; then
                        echo "Legacy volume ${LEGACY_PROJECT}_${VOL} still in use — aborting deploy."
                        exit 1
                    fi
                    docker volume create \
                        --label "com.docker.compose.project=${NEW_PROJECT}" \
                        --label "com.docker.compose.volume=${VOL}" \
                        "${NEW_PROJECT}_${VOL}" >/dev/null
                    if ! docker run --rm --entrypoint sh \
                            -v "${LEGACY_PROJECT}_${VOL}":/from:ro \
                            -v "${NEW_PROJECT}_${VOL}":/to \
                            timescale/timescaledb:latest-pg16 -c 'cp -a /from/. /to/' >/dev/null 2>&1; then
                        docker volume rm "${NEW_PROJECT}_${VOL}" >/dev/null 2>&1 || true
                        echo "Failed to copy ${LEGACY_PROJECT}_${VOL} — aborting (legacy data untouched)."
                        exit 1
                    fi
                    docker volume rm "${LEGACY_PROJECT}_${VOL}" >/dev/null 2>&1 \
                        || echo "Copied, but could not remove legacy volume ${LEGACY_PROJECT}_${VOL} (left in place)."
                    echo "Adopted legacy volume ${LEGACY_PROJECT}_${VOL} -> ${NEW_PROJECT}_${VOL}"
                done
            fi
            docker compose -f docker-compose.standalone.yml down --remove-orphans
            # One-time ADR-0022 DB/role rename (neuro_* → neuronection_*):
            # existing volumes ignore POSTGRES_DB after first boot, so start
            # postgres and rename inside it before the stack boots on the new
            # names. PostgreSQL refuses to rename the session's own user, so
            # the owner role is renamed through a throwaway superuser. No-op
            # when the legacy names don't exist (fresh installs).
            docker compose -f docker-compose.standalone.yml up -d postgres
            CONNECTED=""
            for i in $(seq 1 30); do
                for ROLE in neuronection_health_owner neuro_health_owner admin; do
                    if docker compose -f docker-compose.standalone.yml exec -T postgres \
                            psql -U "$ROLE" -d postgres -tAc "select 1" >/dev/null 2>&1; then
                        CONNECTED="$ROLE"
                        break 2
                    fi
                done
                sleep 2
            done
            if [ -z "$CONNECTED" ]; then
                echo "Cannot connect to postgres to rename legacy database names — aborting deploy."
                # The retry loop swallows stderr by design; without this the
                # abort reason (e.g. a crash-looping postgres) never reaches
                # the job log.
                echo "── postgres container state + last logs ──"
                docker compose -f docker-compose.standalone.yml ps postgres || true
                docker compose -f docker-compose.standalone.yml logs postgres --tail 30 || true
                exit 1
            fi
            PSQLC="docker compose -f docker-compose.standalone.yml exec -T postgres psql -U $CONNECTED -d postgres -v ON_ERROR_STOP=1"
            for OLD_DB in neuro_health health_assistant; do
                if [ "$($PSQLC -tAc "select 1 from pg_database where datname='$OLD_DB'")" = "1" ]; then
                    if [ "$($PSQLC -tAc "select 1 from pg_database where datname='neuronection_health'")" = "1" ]; then
                        echo "Both $OLD_DB and neuronection_health exist — resolve manually before re-running."
                        exit 1
                    fi
                    $PSQLC -c "ALTER DATABASE \"$OLD_DB\" RENAME TO \"neuronection_health\";"
                    echo "Renamed database $OLD_DB -> neuronection_health"
                fi
            done
            if [ "$($PSQLC -tAc "select 1 from pg_roles where rolname='neuro_health_app'")" = "1" ] \
                && [ "$($PSQLC -tAc "select 1 from pg_roles where rolname='neuronection_health_app'")" != "1" ]; then
                $PSQLC -c "ALTER ROLE neuro_health_app RENAME TO neuronection_health_app;"
                echo "Renamed role neuro_health_app -> neuronection_health_app"
            fi
            if [ "$($PSQLC -tAc "select 1 from pg_roles where rolname='neuro_health_owner'")" = "1" ]; then
                if [ "$($PSQLC -tAc "select 1 from pg_roles where rolname='neuronection_health_owner'")" = "1" ]; then
                    echo "Both neuro_health_owner and neuronection_health_owner exist — resolve manually before re-running."
                    exit 1
                fi
                $PSQLC -c "DROP ROLE IF EXISTS ha_db_migrator;"
                $PSQLC -c "CREATE ROLE ha_db_migrator LOGIN SUPERUSER;"
                docker compose -f docker-compose.standalone.yml exec -T postgres \
                    psql -U ha_db_migrator -d postgres -v ON_ERROR_STOP=1 \
                    -c "ALTER ROLE neuro_health_owner RENAME TO neuronection_health_owner;"
                docker compose -f docker-compose.standalone.yml exec -T postgres \
                    psql -U neuronection_health_owner -d postgres -v ON_ERROR_STOP=1 \
                    -c "DROP ROLE ha_db_migrator;"
                echo "Renamed role neuro_health_owner -> neuronection_health_owner"
            fi
            $PSQLC -c "DROP ROLE IF EXISTS ha_db_migrator;" >/dev/null 2>&1 || true
            docker compose -f docker-compose.standalone.yml up -d
            
            # 3. Wait and verify that containers successfully started
            echo "Verifying application startup..."
            sleep 5
            CONTAINER_EXITS=$(docker compose -f docker-compose.standalone.yml ps --format json | grep -i "exited" || true)
            if [ -n "$CONTAINER_EXITS" ]; then
                echo "CRITICAL ERROR: One or more containers failed to start and exited immediately!"
                docker compose -f docker-compose.standalone.yml ps
                docker compose -f docker-compose.standalone.yml logs
                exit 1
            fi
            
            # 4. Run Database Migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.standalone.yml exec -T backend alembic upgrade head
            
            # 5. Clean up old docker images to preserve disk space
            echo "Pruning old unused Docker images..."
            docker image prune -af
            echo "Deployment completed successfully! 🎉"
