name: CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
      - test
  workflow_dispatch:

# One pipeline per branch at a time; a newer push cancels any stale run so a
# superseded commit never reaches production.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token scopes. Registry pushes authenticate with the
# REGISTRY_TOKEN PAT (docker/login-action), not the workflow token.
permissions:
  contents: read
  packages: write

env:
  # Completely secure: these values are pulled from Gitea Secrets at runtime
  REGISTRY: ${{ secrets.REGISTRY_HOST }}
  REPOSITORY: ${{ github.repository_owner }}
  # Branch-aware deployment topology. The `test` branch deploys a fully
  # separate stack on the same host: distinct deploy path, host ports,
  # container-name prefix (STACK_NAME), and floating image tag. TEST_*
  # secrets supply the test topology; the production stack is untouched.
  # Fallbacks are distinct per branch so a missing secret can't silently
  # reuse a production port and collide.
  STACK_NAME: ${{ github.ref_name == 'test' && 'health-assistant-test' || 'health-assistant' }}
  IMAGE_TAG_FLOATING: ${{ github.ref_name == 'test' && 'test' || 'latest' }}
  DEPLOY_PATH: ${{ github.ref_name == 'test' && (secrets.TEST_DEPLOY_PATH || '/home/deploy/health_assistant_test') || (secrets.DEPLOY_PATH || '/home/deploy/health_assistant') }}
  BACKEND_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_BACKEND_PORT || '8001') || (secrets.BACKEND_PORT || '8000') }}
  FRONTEND_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_FRONTEND_PORT || '3001') || (secrets.FRONTEND_PORT || '3000') }}
  FLOWER_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_FLOWER_PORT || '5556') || (secrets.FLOWER_PORT || '5555') }}
  POSTGRES_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_POSTGRES_PORT || '5433') || (secrets.POSTGRES_PORT || '5432') }}
  REDIS_PORT: ${{ github.ref_name == 'test' && (secrets.TEST_REDIS_PORT || '6380') || (secrets.REDIS_PORT || '6379') }}

jobs:
  test-backend:
    name: Run Backend Pytest Suite
    runs-on: ubuntu-latest
    # NOTE: no `services:` block. Gitea act_runner v0.6.x runs every job inside
    # a container (docker.gitea.com/runner-images:ubuntu-latest) and does NOT
    # add service-name DNS aliases for `services:` containers — their actual
    # container names are opaque GITEA-ACTIONS-TASK-… IDs, so neither
    # "postgres" nor "localhost" resolves from the job container. Instead we
    # start postgres + redis via `docker run` (the Docker socket is mounted in
    # the job container) on the job's OWN network with explicit
    # --network-alias, which makes them reliably resolvable by name.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Start database services on the job network
        run: |
          set -euo pipefail
          # Clean up any orphans from a previous (crashed) run — act_runner
          # does not reap manually-started sibling containers.
          docker rm -f ha-test-postgres ha-test-redis 2>/dev/null || true

          # Discover the job container's Docker network (the network act_runner
          # created for this job). `hostname` inside the container is the
          # container's short ID; the Docker socket is mounted so we can
          # inspect ourselves + attach siblings to the same network.
          JOB_CID="$(cat /etc/hostname)"
          JOB_NET="$(docker inspect "$JOB_CID" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' \
            | head -n1)"
          echo "Job container: $JOB_CID  Network: $JOB_NET"
          echo "JOB_NET=$JOB_NET" >> "$GITHUB_ENV"

          docker run -d --rm \
            --name ha-test-postgres \
            --network "$JOB_NET" \
            --network-alias postgres \
            -e POSTGRES_DB=health_assistant_test \
            -e POSTGRES_USER=admin \
            -e POSTGRES_PASSWORD=password \
            timescale/timescaledb:latest-pg14

          docker run -d --rm \
            --name ha-test-redis \
            --network "$JOB_NET" \
            --network-alias redis \
            redis:7-alpine

          echo "Waiting for postgres to accept connections…"
          for i in $(seq 1 30); do
            if docker exec ha-test-postgres pg_isready -U admin -d health_assistant_test >/dev/null 2>&1; then
              echo "postgres is ready"
              break
            fi
            sleep 2
          done

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          # Configure via parts (not DATABASE_URL) so config.py assembles the
          # URL and the b13 security-hygiene tests exercise POSTGRES_PASSWORD.
          # postgres + redis are reached by their --network-alias names set
          # above (resolvable on the job's Docker network).
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DB: health_assistant_test
          REDIS_URL: redis://redis:6379
        run: |
          cd backend
          # Mirror production Docker PYTHONPATH (/app/backend:/app) so the
          # top-level `integrations` package is importable during tests.
          export PYTHONPATH="$(cd .. && pwd):$(pwd)"
          pytest

      - name: Stop database services
        if: always()
        run: docker rm -f ha-test-postgres ha-test-redis 2>/dev/null || true

  test-frontend:
    name: Run Frontend Lint & Build Test
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Build Test
        run: |
          cd frontend
          npm run lint
          npm run build

  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    if: ${{ secrets.REGISTRY_HOST != '' && secrets.REGISTRY_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Registry and Repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ env.REPOSITORY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOWER }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }} # Personal Access Token with package write/read permissions

      - name: Build and Push Backend
        run: |
          docker build -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ env.IMAGE_TAG_FLOATING }} -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ github.sha }} -f docker/Dockerfile .
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ env.IMAGE_TAG_FLOATING }}
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-backend:${{ github.sha }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ env.IMAGE_TAG_FLOATING }} -t ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ github.sha }} -f docker/Dockerfile.frontend .
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ env.IMAGE_TAG_FLOATING }}
          docker push ${{ env.REGISTRY_LOWER }}/${{ env.REPOSITORY_LOWER }}/health-assistant-frontend:${{ github.sha }}

  # OPTIONAL: after new images are pushed, SSH into the demo server and pull +
  # restart the demo stack so it runs the freshly-built :latest images.
  #
  # Opt-in: set the DEMO_DEPLOY_PATH secret in this repo to enable (e.g.
  # /home/deploy/health_assistant_demo). Without it, this job is skipped
  # entirely and the pipeline is unaffected. Override DEMO_VM_HOST too if the
  # demo lives on a different host than production, and DEMO_SSH_PRIVATE_KEY if
  # the demo host uses a separate SSH key (falls back to SSH_PRIVATE_KEY so an
  # unset secret never breaks an existing single-host setup). continue-on-error
  # ensures the pipeline NEVER fails even if the demo SSH/deploy breaks — demo
  # deployment is best-effort, not a critical dependency.
  trigger-demo-deploy:
    name: Redeploy demo with new images (optional)
    needs: build-and-push
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    if: ${{ github.ref_name == 'main' && secrets.DEMO_DEPLOY_PATH != '' }}
    steps:
      - name: Pull new images + restart demo stack
        uses: appleboy/ssh-action@v1
        continue-on-error: true
        env:
          DEMO_PATH: ${{ secrets.DEMO_DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEMO_VM_HOST || secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.DEMO_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          envs: DEMO_PATH
          script: |
            set -euo pipefail
            cd "$DEMO_PATH"
            echo "→ Pulling new :latest images…"
            docker compose -f docker-compose.demo.yml --env-file .env pull
            echo "→ Restarting demo stack…"
            docker compose -f docker-compose.demo.yml --env-file .env up -d
            echo "✅ Demo stack restarted with new images."

  deploy:
    name: Deploy to Target Server
    needs: build-and-push
    runs-on: ubuntu-latest
    container:
      image: gitea/runner-images:ubuntu-latest
    if: ${{ secrets.VM_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Registry and Repository
        run: |
          echo "REGISTRY_LOWER=$(echo '${{ env.REGISTRY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "REPOSITORY_LOWER=$(echo '${{ env.REPOSITORY }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare Deployment Directory via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script: |
            mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Copy Compose and Database Init Configs
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          source: "docker/docker-compose.prod.yml,docker/init-db.sql"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy Stack and Run Migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT || '22' }}
          script: |
            # Enable strict error tracking (Exit on any error/undefined-variable/pipeline-failure)
            set -euo pipefail
            
            cd ${{ env.DEPLOY_PATH }}
            
            # Log in to registry on the target server
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY_LOWER }} -u ${{ github.actor }} --password-stdin
            
            # Write environmental configs using secrets stored in Gitea Repo Settings
            cat << 'EOF' > .env
            REGISTRY=${{ env.REGISTRY_LOWER }}
            REPOSITORY=${{ env.REPOSITORY_LOWER }}
            IMAGE_TAG=${{ github.sha }}
            STACK_NAME=${{ env.STACK_NAME }}
            
            # Application
            APP_ENV=production
            DEBUG=false
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            INTEGRATION_SECRET_KEY=${{ secrets.INTEGRATION_SECRET_KEY }}
            # Default 1h since the 2026-08 security audit (was 24h).
            JWT_EXPIRATION_HOURS=${{ secrets.JWT_EXPIRATION_HOURS || '1' }}
            # Reverse-proxy chain depth for rate-limit identity (audit 2026-08
            # AUTH-H1). This stack fronts the backend with a host proxy on
            # 127.0.0.1, so exactly 1 trusted hop.
            TRUSTED_PROXY_COUNT=${{ secrets.TRUSTED_PROXY_COUNT || '1' }}
            
            # PostgreSQL Secrets
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'health_assistant' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'admin' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ env.POSTGRES_PORT }}
            
            # Redis Secrets
            REDIS_PORT=${{ env.REDIS_PORT }}
            # REQUIRED (audit 2026-08 CFG-M1): Redis runs with requirepass and
            # the compose file refuses to start without this. Set the
            # REDIS_PASSWORD repo secret before the next deploy.
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            
            # Ports exposed by container
            BACKEND_PORT=${{ env.BACKEND_PORT }}
            FRONTEND_PORT=${{ env.FRONTEND_PORT }}
            FLOWER_PORT=${{ env.FLOWER_PORT }}
            FLOWER_USER=${{ secrets.FLOWER_USER || 'admin' }}
            FLOWER_PASSWORD=${{ secrets.FLOWER_PASSWORD }}
            
            # Host/Interface Binds
            BACKEND_BIND=${{ secrets.BACKEND_BIND || '127.0.0.1' }}
            FRONTEND_BIND=${{ secrets.FRONTEND_BIND || '127.0.0.1' }}
            FLOWER_BIND=${{ secrets.FLOWER_BIND || '127.0.0.1' }}
            
            # AI / OCR API Key and Model Customization
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}
            OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
            OCR_PROVIDER=${{ secrets.OCR_PROVIDER || 'openai' }}
            
            # SMTP Secrets (optional)
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM || 'noreply@health-assistant.local' }}

            # Web Push (VAPID) — required in production or the app refuses to boot
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_ADMIN_EMAIL=${{ secrets.VAPID_ADMIN_EMAIL || 'admin@healthassistant.local' }}
            EOF
            
            # 1. Pull new images explicitly BEFORE bringing down active containers
            # This prevents downtime if network or authentication fails during pull!
            echo "Pulling new Docker images..."
            docker compose -f docker-compose.prod.yml pull
            
            # 2. Stop old containers and start new ones
            echo "Restarting application stack..."
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d
            
            # 3. Wait and verify that containers successfully started
            echo "Verifying application startup..."
            sleep 5
            CONTAINER_EXITS=$(docker compose -f docker-compose.prod.yml ps --format json | grep -i "exited" || true)
            if [ -n "$CONTAINER_EXITS" ]; then
                echo "CRITICAL ERROR: One or more containers failed to start and exited immediately!"
                docker compose -f docker-compose.prod.yml ps
                docker compose -f docker-compose.prod.yml logs
                exit 1
            fi
            
            # 4. Run Database Migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            
            # 5. Clean up old docker images to preserve disk space
            echo "Pruning old unused Docker images..."
            docker image prune -af
            echo "Deployment completed successfully! 🎉"
