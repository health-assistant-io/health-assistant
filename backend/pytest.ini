[pytest]
# Only look for tests inside the tests directory
testpaths = tests
# Adds pythonpath to avoid import errors. ``..`` adds the repo root so the
# ``integrations`` package (moved out of backend/ in commit 115f687) resolves.
pythonpath = . ..
# Automatically loads .env file for environment variables if needed
env_files =
    .env.test
    .env
# Shows clear verbose output for test summaries
addopts = -v --tb=short
# Explicitly sets asyncio mode to auto (which prevents strict warnings)
asyncio_mode = auto
markers =
    # identity-auth §18 contract cases — the drift gate against the family
    # test kit (CI runs `pytest -m contract` as an explicit step).
    contract: implements an identity-auth §18 contract case (family drift gate)