# Dev infrastructure only (app runs on the host, not in Docker).
# Brings up Postgres (TimescaleDB) + Redis so local `./scripts/run-dev.sh` works.
#
#   docker compose -f docker/docker-compose.dev-db.yml up -d
#
# Host ports are read from the root .env via POSTGRES_PORT and REDIS_PORT.
# The init scripts create the app DB (`neuronection_health` — deployment.md /
# ADR-0022 naming), the family roles (`neuronection_health_owner` runs migrations,
# `neuronection_health_app` is the DML-only runtime role) and the companion test
# database `neuronection_health_test` (pytest refuses any DB not ending in `_test`).
#
# NOTE for existing checkouts: the bootstrap user changed from `admin` to
# `neuronection_health_owner`. Update the root `.env`
# (`POSTGRES_DB=neuronection_health`, `POSTGRES_USER=neuronection_health_owner`) and run
# `./scripts/reset-dev-db.sh` to recreate the volume — see docker/README.md
# → "Databases & roles".
#
# Explicit project name (distinct from the all-in-one dev stack): the
# `health-assistant-dev_*` volume prefix no longer depends on the directory
# `docker compose` is invoked from — see docker/README.md → "Compose project
# name & volumes" for adopting legacy `docker_*` volumes.
name: health-assistant-dev

services:
  # PostgreSQL 16 with TimescaleDB (deployment.md datastore rule; health
  # keeps its TimescaleDB-optional image).
  postgres-dev1:
    image: timescale/timescaledb:latest-pg16
    container_name: health-assistant-postgres-dev1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      # The bootstrap superuser IS the migration owner role (deployment.md).
      # Hardcoded on purpose: a stale POSTGRES_USER=admin in an old .env must
      # not resurrect the single-admin-role layout on fresh volumes.
      POSTGRES_USER: neuronection_health_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_APP_USER: neuronection_health_app
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-neuronection_health_test}
    volumes:
      - postgres_data-dev1:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init-roles.sh:/docker-entrypoint-initdb.d/02-init-roles.sh:ro
    ports:
      # Loopback-only (audit 2026-08 CFG-M2): a dev DB with a well-known
      # password must not listen on every interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronection_health_owner -d ${POSTGRES_DB:-neuronection_health}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-assistant-network

  # Redis — task queue (Celery) + integration OAuth state store (Stage 2)
  redis-dev1:
    image: redis:7-alpine
    container_name: health-assistant-redis-dev1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data-dev1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-assistant-network

volumes:
  postgres_data-dev1:
  redis_data-dev1:

networks:
  health-assistant-network:
    driver: bridge
