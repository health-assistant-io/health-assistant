# Health Assistant — TLS-terminating Nginx (Standalone Flavor)
#
# Copy to nginx-TLS.conf (or mount this file over nginx.conf) and mount:
#   ./certs/fullchain.pem → /etc/nginx/certs/fullchain.pem
#   ./certs/privkey.pem   → /etc/nginx/certs/privkey.pem
#
# Replace SERVER_NAME with your domain. Port 80 answers ACME HTTP-01
# challenges (certbot webroot renewals) and redirects everything else to
# HTTPS (audit 2026-08 CFG-H2).

server {
    listen 80;
    server_name SERVER_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name SERVER_NAME;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (backend also sets it, but set it here so it covers static assets)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 60m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location /flower/ {
        proxy_pass http://flower:5555;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
