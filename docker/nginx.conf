# Health Assistant — Docker Nginx Configuration (Standalone Flavor)
#
# ⚠️ HTTP-ONLY — for local dev / VPN / loopback use.
#
# Internet-facing deployments MUST serve over TLS: copy
# nginx-TLS.conf over this file (or point the compose volume at it) and
# mount certificates (see docs/INSTALL.md → TLS). Health data, login
# credentials and bearer tokens must never cross the network in cleartext
# (audit 2026-08 CFG-H2).

server {
    listen 80;
    server_name _; # Catch-all, or replace with your domain

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Backend API (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;

        # nginx inherits proxy_set_header from the server block ONLY when a
        # location declares none of its own — the Upgrade/Connection lines
        # below would silently drop Host/X-Forwarded-*, and the backend would
        # see Host: backend:8000, which TrustedHost rejects with 400
        # "Invalid host header" on every /api request regardless of APP_URL.
        # Re-declare the full set here (demo-gateway nginx.demo.conf pattern).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running background tasks (e.g., AI extractions)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;

        # Support for Server-Sent Events (SSE) and WebSockets (/api/v1/ws/*)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # 2. Backend health check (docs are disabled in prod builds; see
    # ENABLE_API_DOCS on the backend).
    location = /health {
        proxy_pass http://backend:8000;
    }

    # 3. Flower (Celery Monitoring UI) — protected by Flower's own basic
    # auth (FLOWER_USER / FLOWER_PASSWORD; required in every flavor —
    # audit H6). Still bind/route carefully: it exposes task payloads.
    location /flower/ {
        proxy_pass http://flower:5555;

        # Full header set re-declared (see /api/ above): the Upgrade/Connection
        # lines below cancel nginx's server-level proxy_set_header inheritance.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Flower's real-time task updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # 4. Frontend (React SPA build)
    # This must be the last block to act as a catch-all for React Router routes.
    location / {
        proxy_pass http://frontend:3000;
    }
}
