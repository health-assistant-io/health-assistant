# Health Assistant — Docker Nginx Configuration (Standalone Flavor)
#
# ⚠️ HTTP-ONLY — for local dev / VPN / loopback use.
#
# Internet-facing deployments MUST serve over TLS: copy
# nginx-TLS.conf over this file (or point the compose volume at it) and
# mount certificates (see docs/INSTALL.md → TLS). Health data, login
# credentials and bearer tokens must never cross the network in cleartext
# (audit 2026-08 CFG-H2).

server {
    listen 80;
    server_name _; # Catch-all, or replace with your domain

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Backend API (FastAPI)
    location /api/ {
        proxy_pass http://backend:8000;

        # Extended timeouts for long-running background tasks (e.g., AI extractions)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;

        # Support for Server-Sent Events (SSE) and WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # 2. Backend health check (docs are disabled in prod builds; see
    # ENABLE_API_DOCS on the backend).
    location = /health {
        proxy_pass http://backend:8000;
    }

    # 3. Flower (Celery Monitoring UI) — protected by Flower's own basic
    # auth; bind to 127.0.0.1 in compose unless intentionally exposed.
    location /flower/ {
        proxy_pass http://flower:5555;

        # WebSocket support for Flower's real-time task updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # 4. Frontend (React SPA build)
    # This must be the last block to act as a catch-all for React Router routes.
    location / {
        proxy_pass http://frontend:3000;
    }
}
