# Health Assistant — production Docker Compose.
#
# This file is the canonical production deployment. Docker Compose is the
# process supervisor here (NOT honcho — honcho is dev-only). Each service
# runs in its own container with its own restart policy, healthcheck,
# resource limits, and log rotation. Failure domains are isolated: a
# crashed worker does NOT bring down the backend or frontend.
#
# Required env vars (set in .env or your secret manager):
#   POSTGRES_PASSWORD (DB OWNER secret), HA_DB_PASSWORD (app DB secret —
#   ADR-0064: the two must be distinct), HA_SESSION_KEY, HA_REFRESH_KEY,
#   HA_DATA_KEY, OPENAI_API_KEY, FLOWER_PASSWORD (with --profile flower),
#   REGISTRY, REPOSITORY, IMAGE_TAG (for pre-built images)
#
# Optional env vars (have defaults):
#   POSTGRES_DB (default neuronection_health — deployment.md / ADR-0022 naming),
#   POSTGRES_PORT, REDIS_PORT,
#   BACKEND_PORT, FRONTEND_PORT, FLOWER_PORT,
#   CELERY_WORKER_CONCURRENCY, CELERY_MAX_TASKS_PER_CHILD,
#   BACKEND_MEMORY, WORKER_MEMORY, BACKEND_CPUS, WORKER_CPUS,
#   BACKUP_INTERVAL_HOURS, BACKUP_KEEP (scheduled backup sidecar),
#   LOG_MAX_SIZE, LOG_MAX_FILE,
#   STACK_NAME (compose project + container-name prefix; defaults to
#               "health-assistant". Set to a distinct value, e.g.
#               "health-assistant-test", to run a second stack side-by-side
#               on the same host: it pins the top-level `name:` too, so
#               containers, named volumes AND the bridge network are all
#               isolated by this one knob — independent of the directory
#               the command runs from. The deploy workflow migrates volumes
#               from the old dir-derived project name automatically.)
#
# Bring up:    docker compose --env-file .env -f docker/docker-compose.prod.yml up -d
# Migrate only: docker compose --env-file .env -f docker/docker-compose.prod.yml run --rm migrate
# View logs:   docker compose --env-file .env -f docker/docker-compose.prod.yml logs -f backend worker
# Stop:        docker compose --env-file .env -f docker/docker-compose.prod.yml down

# Explicit project name: STACK_NAME pins the WHOLE compose project —
# containers, named volumes and the bridge network — independent of the
# invocation directory. Volumes left under the old dir-derived project name
# (deploy-dir basename) are adopted by .gitea/workflows/deploy.yml on the
# next deploy (one-time rename; see docker/README.md → "Compose project
# name & volumes").
name: ${STACK_NAME:-health-assistant}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

x-backend-env: &backend-env
  HA_APP_ENV: production
  DEBUG: "false"
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
  # Two-role credential split (ADR-0064 / plan 64): the runtime connects as
  # the least-privilege neuronection_health_app role via HA_DB_PASSWORD.
  # POSTGRES_PASSWORD is the OWNER secret — it exists only on the db and
  # migrate services below; serving containers must never receive it (the
  # conformance gate fails the stack if they do).
  POSTGRES_USER: neuronection_health_app
  HA_DATABASE_URL: postgresql+asyncpg://neuronection_health_app:${HA_DB_PASSWORD:?Set HA_DB_PASSWORD (app DB password, distinct from POSTGRES_PASSWORD) in .env}@postgres:5432/${POSTGRES_DB:-neuronection_health}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_BASE: ${OPENAI_API_BASE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Per-purpose key family (identity-auth §8, plan 16 H4): session/refresh
  # signing keys are REQUIRED (weak/missing values refuse to boot). The
  # pre-H4 INTEGRATION_SECRET_KEY alias is retired (no fallback) — set
  # HA_DATA_KEY directly; _PREVIOUS is the decrypt-only rotation ring.
  HA_SESSION_KEY: ${HA_SESSION_KEY:?Set HA_SESSION_KEY in .env (python3 -c "from secrets import token_urlsafe; print(token_urlsafe(48))")}
  HA_REFRESH_KEY: ${HA_REFRESH_KEY:?Set HA_REFRESH_KEY in .env (python3 -c "from secrets import token_urlsafe; print(token_urlsafe(48))")}
  HA_DATA_KEY: ${HA_DATA_KEY:-}
  HA_DATA_KEY_PREVIOUS: ${HA_DATA_KEY_PREVIOUS:-}
  OCR_PROVIDER: ${OCR_PROVIDER:-openai}
  HA_AUTH_ACCESS_TTL_MINUTES: ${HA_AUTH_ACCESS_TTL_MINUTES:-60}
  # §16 HTTP security surface (plan 21): per-bucket rate-limit ceilings
  # (requests/minute; 0 disables a bucket; unset keeps the route default)
  # and the rightmost-X-Forwarded-For hop count the ingress appends —
  # without these the deployed limiter is untunable and per-IP identity
  # keys on the proxy's socket address.
  HA_RATELIMIT_ENABLED: ${HA_RATELIMIT_ENABLED:-true}
  HA_RATELIMIT_AUTH: ${HA_RATELIMIT_AUTH:-}
  HA_RATELIMIT_AUTH_EMAIL: ${HA_RATELIMIT_AUTH_EMAIL:-}
  HA_RATELIMIT_AI: ${HA_RATELIMIT_AI:-}
  HA_RATELIMIT_MCP: ${HA_RATELIMIT_MCP:-}
  HA_RATELIMIT_DEFAULT: ${HA_RATELIMIT_DEFAULT:-}
  HA_TRUSTED_PROXY_COUNT: ${HA_TRUSTED_PROXY_COUNT:-1}
  # Cookie Secure is DERIVED, never static (plan 64 §1.6): HA_COOKIE_SECURE
  # left empty means the app derives it from the public scheme (APP_URL https)
  # or HA_TLS, so LAN/VPN HTTP login keeps working and TLS deployments get
  # Secure without hand-editing flags.
  HA_COOKIE_SECURE: ${HA_COOKIE_SECURE:-}
  HA_TLS: ${HA_TLS:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@healthassistant.local}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-admin@healthassistant.local}
  APP_URL: ${APP_URL:-}
  HA_UPLOAD_DIR: /app/uploads
  # Family object storage (optional in self-host, required under a cloud
  # profile). The backend resolves one backend at boot and probes it. Empty
  # values keep the local default; provider-specific knobs that have a
  # contract default are deliberately not emitted here (path style, TLS
  # verify, timeouts, max attempts) so the operator's env can set them only
  # where needed. `docker-compose.cloud.yml` supplies the cloud profile.
  HA_CLOUD_PROFILE: ${HA_CLOUD_PROFILE:-}
  HA_OBJECT_STORAGE_BACKEND: ${HA_OBJECT_STORAGE_BACKEND:-}
  HA_OBJECT_STORAGE_REQUIRED: ${HA_OBJECT_STORAGE_REQUIRED:-false}
  HA_OBJECT_STORAGE_LOCAL_ROOT: ${HA_OBJECT_STORAGE_LOCAL_ROOT:-}
  HA_EXPORT_MAX_MB: ${HA_EXPORT_MAX_MB:-1024}
  # MAX_MB/PRESIGN_TTL are omitted on purpose: the app binds the cap to
  # MAX_UPLOAD_SIZE and the TTL to the contract default. An operator who
  # overrides either adds the variable in their env/override file.
  HA_S3_BUCKET: ${HA_S3_BUCKET:-}
  HA_S3_REGION: ${HA_S3_REGION:-}
  HA_S3_ENDPOINT_URL: ${HA_S3_ENDPOINT_URL:-}
  HA_S3_ACCESS_KEY_ID: ${HA_S3_ACCESS_KEY_ID:-}
  HA_S3_SECRET_ACCESS_KEY: ${HA_S3_SECRET_ACCESS_KEY:-}
  HA_S3_SESSION_TOKEN: ${HA_S3_SESSION_TOKEN:-}
  HA_S3_SSE: ${HA_S3_SSE:-}
  HA_S3_KMS_KEY_ID: ${HA_S3_KMS_KEY_ID:-}
  HA_S3_PREFIX: ${HA_S3_PREFIX:-}
  HA_AZURE_STORAGE_CONTAINER: ${HA_AZURE_STORAGE_CONTAINER:-}
  HA_AZURE_STORAGE_CONNECTION_STRING: ${HA_AZURE_STORAGE_CONNECTION_STRING:-}
  HA_AZURE_STORAGE_ACCOUNT_URL: ${HA_AZURE_STORAGE_ACCOUNT_URL:-}
  HA_AZURE_STORAGE_ACCOUNT_NAME: ${HA_AZURE_STORAGE_ACCOUNT_NAME:-}
  HA_AZURE_STORAGE_CREDENTIAL: ${HA_AZURE_STORAGE_CREDENTIAL:-}
  HA_AZURE_STORAGE_PREFIX: ${HA_AZURE_STORAGE_PREFIX:-}
  AI_AGENT_MAX_ITERATIONS: ${AI_AGENT_MAX_ITERATIONS:-20}
  MCP_STDIO_ALLOWED_COMMANDS: ${MCP_STDIO_ALLOWED_COMMANDS:-npx,uvx,python,python3,node}
  MCP_MAX_SERVERS_PER_USER: ${MCP_MAX_SERVERS_PER_USER:-5}
  MCP_MAX_TOTAL_STDIO: ${MCP_MAX_TOTAL_STDIO:-20}
  MCP_REQUEST_TIMEOUT: ${MCP_REQUEST_TIMEOUT:-30}
  MCP_TOOL_RESULT_MAX_BYTES: ${MCP_TOOL_RESULT_MAX_BYTES:-65536}
  INTEGRATION_MAX_TOOLS_PER_SESSION: ${INTEGRATION_MAX_TOOLS_PER_SESSION:-20}
  MCP_CONNECTION_IDLE_TIMEOUT: ${MCP_CONNECTION_IDLE_TIMEOUT:-900}
  MCP_PER_INSTANCE_CONCURRENCY: ${MCP_PER_INSTANCE_CONCURRENCY:-4}
  MCP_ALLOW_INSECURE_HTTP: ${MCP_ALLOW_INSECURE_HTTP:-false}

services:
  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 with TimescaleDB
  #
  # deployment.md datastore rule: web mode runs PostgreSQL 16 — health keeps
  # its TimescaleDB-optional image (latest-pg16 tag; timescaledb + pgcrypto +
  # pg_trgm are all available there, and the migrations that use TimescaleDB
  # features degrade gracefully when the extension is absent). Data
  # directories are NOT compatible across major versions: existing pg14
  # volumes must move via backup → fresh volume → restore (docker/README.md
  # → "Upgrading from pg14").
  # ───────────────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${STACK_NAME:-health-assistant}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      # The bootstrap superuser IS the migration owner role (deployment.md:
      # neuronection_health_owner runs migrations) — its secret is
      # POSTGRES_PASSWORD (ADR-0064 owner credential: used only here and by
      # the migrate service / host restore; never by serving containers).
      POSTGRES_USER: neuronection_health_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (DB OWNER password) in .env}
      # The runtime role + its DISTINCT secret (ADR-0064): HA_DB_PASSWORD.
      POSTGRES_APP_USER: neuronection_health_app
      POSTGRES_APP_PASSWORD: ${HA_DB_PASSWORD:?Set HA_DB_PASSWORD (app DB password, distinct from POSTGRES_PASSWORD) in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init-roles.sh:/docker-entrypoint-initdb.d/02-init-roles.sh:ro
    ports:
      # Bind to localhost only — do not expose the DB to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronection_health_owner -d ${POSTGRES_DB:-neuronection_health}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Redis (broker + cache + OAuth state store)
  # ───────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-health-assistant}-redis
    restart: unless-stopped
    # Audit 2026-08 CFG-M1: Redis requires a password (refresh/session jti
    # store, rate limits, OAuth state live here — an unauthenticated Redis on
    # the docker network was one compromised container away from total
    # token-revocation bypass).
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Migrations + provisioning (one-shot, OWNER role — ADR-0064)
  #
  # The only service that ever receives the owner credential. It provisions
  # (extensions, app role, grants, default privileges, backup ledger table),
  # runs `alembic upgrade head`, creates the langgraph checkpoint tables, then
  # re-grants and VERIFIES the app role is DML-only. All app containers depend
  # on it with `condition: service_completed_successfully`, so they wait for
  # migrations to complete before booting, and serving code never runs DDL.
  #
  # Re-run manually: docker compose -f docker/docker-compose.prod.yml run --rm migrate
  # ───────────────────────────────────────────────────────────────────────
  migrate:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-migrate
    restart: "no"
    environment:
      <<: *backend-env
      # Owner credential + DSN (ADR-0064): the canonical
      # HA_MIGRATIONS_DATABASE_URL is what alembic / provision_db /
      # setup_checkpoints prefer; it lives HERE ONLY — never in the serving
      # env. HA_DB_SPLIT=1 without this URL refuses to migrate (fail closed).
      HA_DB_SPLIT: "1"
      POSTGRES_USER: neuronection_health_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (DB OWNER password) in .env}
      POSTGRES_APP_PASSWORD: ${HA_DB_PASSWORD:?Set HA_DB_PASSWORD (app DB password, distinct from POSTGRES_PASSWORD) in .env}
      HA_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://neuronection_health_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (DB OWNER password) in .env}@postgres:5432/${POSTGRES_DB:-neuronection_health}
    depends_on:
      postgres:
        condition: service_healthy
    # Provision (owner seam) → Alembic → checkpoint tables → re-grant + verify.
    # scripts/provision_db.py owns extensions/app-role/grants/ledger DDL;
    # app-role DML on the created tables is covered by the default privileges.
    command: >
      sh -c "python scripts/provision_db.py pre &&
             alembic upgrade head &&
             python scripts/setup_checkpoints.py &&
             python scripts/provision_db.py post"
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Backend API (uvicorn)
  #
  # Does NOT run migrations (handled by `migrate` service above). Reverse
  # proxy (nginx/Traefik) should terminate TLS and forward to this service.
  # The port binding below defaults to 127.0.0.1 only — set
  # BACKEND_BIND_ALL=true and override BACKEND_PORT to expose directly.
  # ───────────────────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-backend
    restart: unless-stopped
    init: true
    environment: *backend-env
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-1G}
          cpus: "${BACKEND_CPUS:-1.0}"
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Celery Worker
  #
  # Processes background jobs: OCR, NLP extraction, notifications,
  # integration syncs, export/import, biomarker-data migration.
  # --concurrency defaults to 2 (override via CELERY_WORKER_CONCURRENCY).
  # --max-tasks-per-child recycles the worker process every N tasks to
  # release memory leaked by ML/OCR libraries.
  # ───────────────────────────────────────────────────────────────────────
  worker:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-worker
    restart: unless-stopped
    init: true
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Local/self-host worker: OCR/DICOM/PDF processors materialize and read
    # documents from the same uploads volume the backend writes. A cloud
    # profile removes this mount via docker-compose.cloud.yml.
    volumes:
      - uploads:/app/uploads
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-100}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -t 5 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-2G}
          cpus: "${WORKER_CPUS:-2.0}"
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Celery Beat (periodic task scheduler)
  #
  # Fires scheduled tasks: cleanup_stuck_extractions (5min),
  # check_notification_triggers (60s), sync_active_integrations (60s beat;
  # per-instance sync_interval default 15min). Without this service,
  # medication reminders, recurring notifications, and auto-sync NEVER FIRE
  # in production.
  #
  # Only ONE beat instance must run — beat is not idempotent. Do NOT scale.
  # ───────────────────────────────────────────────────────────────────────
  beat:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-beat
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      POSTGRES_USER: neuronection_health_app
      # App-role DSN only (ADR-0064): beat never sees the owner credential.
      HA_DATABASE_URL: postgresql+asyncpg://neuronection_health_app:${HA_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuronection_health}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Flower (Celery monitoring UI) — OPT-IN via --profile flower (plan 64).
  #
  # Off by default: Flower exposes task payloads (health data) and is an
  # operator tool, not a stack dependency. The bundled nginx resolves the
  # flower upstream lazily (nginx.conf), so profiling it off never breaks
  # proxy startup — /flower/ just 502s while disabled.
  #
  # Auth required (FLOWER_USER / FLOWER_PASSWORD). Bind to 127.0.0.1 by
  # default — expose via your reverse proxy with TLS, OR set
  # FLOWER_BIND_ALL=true to expose directly (not recommended).
  # ───────────────────────────────────────────────────────────────────────
  flower:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-flower
    restart: unless-stopped
    init: true
    profiles: ["flower"]
    ports:
      - "${FLOWER_BIND:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u ${FLOWER_USER:-admin}:${FLOWER_PASSWORD} http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Frontend (Vite preview — production build)
  # ───────────────────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-frontend:${IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-health-assistant}-frontend
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    # No `command` override: the frontend image's default CMD serves the built
    # SPA on 3000 via `serve`. the Vite dev server needs the source tree +
    # package.json, which the production image intentionally does not ship.
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Backup sidecar (same-host dump — labelled NON-DR; plan 64 / ADR-0063)
  #
  # Writes pg_dump -Fc of neuronection_health (+ the uploads tarball) to the
  # ./backups bind mount — the SAME HOST as the database. That is a
  # convenience copy, not disaster recovery: a host disk failure loses the
  # database and these dumps together. T1 deployments must run the host-side
  # `scripts/backup.sh` (host timer/systemd) instead — it encrypts, uploads
  # OFF-HOST (S3/Azure/rclone) and records a backup_runs ledger row per run.
  # Enable this sidecar only for local convenience:
  #   --profile backup
  # ───────────────────────────────────────────────────────────────────────
  backup:
    image: timescale/timescaledb:latest-pg16 # pg_dump from the same image as the server
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Owner credential (pg_dump reads catalog + all tables; ADR-0063).
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      POSTGRES_USER: neuronection_health_owner
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      HA_CLOUD_PROFILE: ${HA_CLOUD_PROFILE:-}
      HA_OBJECT_STORAGE_BACKEND: ${HA_OBJECT_STORAGE_BACKEND:-}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        pg_dump -h $$PGHOST -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/db-$$ts.dump;
        if [ -z "$$HA_CLOUD_PROFILE" ] && { [ -z "$$HA_OBJECT_STORAGE_BACKEND" ] || [ "$$HA_OBJECT_STORAGE_BACKEND" = "local" ]; }; then
          tar czf /backups/uploads-$$ts.tar.gz -C /uploads . || true;
        else
          echo "object storage backend: object bytes are provider-durable; skipping the uploads volume" >&2;
        fi;
        find /backups -name "db-*.dump" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        find /backups -name "uploads-*.tar.gz" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    logging: *default-logging
    networks:
      - health-assistant-network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  health-assistant-network:
    driver: bridge
