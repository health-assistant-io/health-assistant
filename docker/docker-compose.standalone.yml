# Health Assistant — standalone self-hosted stack (postgres + redis + app
# + nginx + backup): the canonical single-host deployment per deployment.md.
#
# Docker Compose is the process supervisor here (NOT honcho — honcho is
# dev-only). Each service runs in its own container with its own restart
# policy, healthcheck, resource limits, and log rotation. Failure domains
# are isolated: a crashed worker does NOT bring down the backend or
# frontend.
#
# Required env vars (set in .env or your secret manager):
#   POSTGRES_PASSWORD, HA_SESSION_KEY, HA_REFRESH_KEY, HA_DATA_KEY (or the
#   REDIS_PASSWORD, FLOWER_PASSWORD,
#   REGISTRY, REPOSITORY, IMAGE_TAG (for pre-built images)
#
# Optional env vars (have defaults):
#   POSTGRES_DB (default neuronection_health — deployment.md / ADR-0022 naming),
#   POSTGRES_PORT, REDIS_PORT, BACKEND_PORT, FRONTEND_PORT, FLOWER_PORT,
#   CELERY_WORKER_CONCURRENCY, CELERY_MAX_TASKS_PER_CHILD,
#   BACKEND_MEMORY, WORKER_MEMORY, BACKEND_CPUS, WORKER_CPUS,
#   BACKUP_INTERVAL_HOURS, BACKUP_KEEP (scheduled backup sidecar),
#   LOG_MAX_SIZE, LOG_MAX_FILE
#
# Bring up:    docker compose --env-file .env -f docker/docker-compose.standalone.yml up -d
# + backups:   docker compose --env-file .env -f docker/docker-compose.standalone.yml --profile backup up -d
# Migrate only: docker compose --env-file .env -f docker/docker-compose.standalone.yml run --rm migrate
# View logs:   docker compose --env-file .env -f docker/docker-compose.standalone.yml logs -f backend worker
# Stop:        docker compose --env-file .env -f docker/docker-compose.standalone.yml down
#
# (--env-file .env is required when running from the repo root: compose reads
#  .env from the compose file's directory by default.)

# Explicit project name: volumes/networks get a deterministic
# `health-assistant_*` prefix regardless of where `docker compose` runs.
# scripts/install.sh + scripts/update-docker.sh adopt legacy dir-derived
# volumes automatically (one-time copy — see docker/README.md → "Compose
# project name & volumes").
name: health-assistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

x-backend-env: &backend-env
  HA_APP_ENV: production
  DEBUG: "false"
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
  # Two-role split (deployment.md / ADR-0022): the runtime connects as the
  # least-privilege neuronection_health_app role (DML only); only the one-shot
  # `migrate` service uses the owner role. Both roles share POSTGRES_PASSWORD.
  POSTGRES_USER: neuronection_health_app
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DATABASE_URL: postgresql+asyncpg://neuronection_health_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-neuronection_health}  # gate-allow: DATABASE_URL (live health env name — plan 23 D3 triage)
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_API_BASE: ${OPENAI_API_BASE:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  # Per-purpose key family (identity-auth §8, plan 16 H4): session/refresh
  # signing keys are REQUIRED (weak/missing values refuse to boot). The
  # pre-H4 INTEGRATION_SECRET_KEY alias is retired (no fallback) — set
  # HA_DATA_KEY directly; _PREVIOUS is the decrypt-only rotation ring.
  HA_SESSION_KEY: ${HA_SESSION_KEY:?Set HA_SESSION_KEY in .env (python3 -c "from secrets import token_urlsafe; print(token_urlsafe(48))")}
  HA_REFRESH_KEY: ${HA_REFRESH_KEY:?Set HA_REFRESH_KEY in .env (python3 -c "from secrets import token_urlsafe; print(token_urlsafe(48))")}
  HA_DATA_KEY: ${HA_DATA_KEY:-}
  HA_DATA_KEY_PREVIOUS: ${HA_DATA_KEY_PREVIOUS:-}
  OCR_PROVIDER: ${OCR_PROVIDER:-openai}
  HA_AUTH_ACCESS_TTL_MINUTES: ${HA_AUTH_ACCESS_TTL_MINUTES:-60}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@healthassistant.local}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_ADMIN_EMAIL: ${VAPID_ADMIN_EMAIL:-admin@healthassistant.local}
  APP_URL: ${APP_URL:-}
  UPLOAD_DIR: /app/uploads  # gate-allow: UPLOAD_DIR (live health env name — plan 23 D3 triage)
  AI_AGENT_MAX_ITERATIONS: ${AI_AGENT_MAX_ITERATIONS:-20}
  MCP_STDIO_ALLOWED_COMMANDS: ${MCP_STDIO_ALLOWED_COMMANDS:-npx,uvx,python,python3,node}
  MCP_MAX_SERVERS_PER_USER: ${MCP_MAX_SERVERS_PER_USER:-5}
  MCP_MAX_TOTAL_STDIO: ${MCP_MAX_TOTAL_STDIO:-20}
  MCP_REQUEST_TIMEOUT: ${MCP_REQUEST_TIMEOUT:-30}
  MCP_TOOL_RESULT_MAX_BYTES: ${MCP_TOOL_RESULT_MAX_BYTES:-65536}
  INTEGRATION_MAX_TOOLS_PER_SESSION: ${INTEGRATION_MAX_TOOLS_PER_SESSION:-20}
  MCP_CONNECTION_IDLE_TIMEOUT: ${MCP_CONNECTION_IDLE_TIMEOUT:-900}
  MCP_PER_INSTANCE_CONCURRENCY: ${MCP_PER_INSTANCE_CONCURRENCY:-4}
  MCP_ALLOW_INSECURE_HTTP: ${MCP_ALLOW_INSECURE_HTTP:-false}

services:
  # ───────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 with TimescaleDB
  #
  # deployment.md datastore rule: web mode runs PostgreSQL 16 — health keeps
  # its TimescaleDB-optional image (latest-pg16 tag; timescaledb + pgcrypto +
  # pg_trgm are all available there, and the migrations that use TimescaleDB
  # features degrade gracefully when the extension is absent). Data
  # directories are NOT compatible across major versions: existing pg14
  # volumes must move via backup → fresh volume → restore (docker/README.md
  # → "Upgrading from pg14").
  # ───────────────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: health-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      # The bootstrap superuser IS the migration owner role (deployment.md:
      # neuronection_health_owner runs migrations). init-roles.sh creates the
      # least-privilege neuronection_health_app runtime role on first boot.
      POSTGRES_USER: neuronection_health_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_USER: neuronection_health_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init-roles.sh:/docker-entrypoint-initdb.d/02-init-roles.sh:ro
    ports:
      # Bind to localhost only — do not expose the DB to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronection_health_owner -d ${POSTGRES_DB:-neuronection_health}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Redis (broker + cache + OAuth state store)
  # ───────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: health-assistant-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Migrations (one-shot)
  #
  # Runs `alembic upgrade head` and exits. All app containers depend on it
  # with `condition: service_completed_successfully`, so they wait for
  # migrations to complete before booting. This avoids the previous race
  # where parallel backend replicas ran migrations simultaneously, and
  # decouples migration failure from backend boot (Compose surfaces the
  # migrate container's failure clearly).
  #
  # Two-role split (deployment.md / ADR-0022): migrations run as the owner
  # role (DDL) — this service overrides the shared x-backend-env anchor with
  # the neuronection_health_owner URL, the compose-level equivalent of career/
  # study's `SA_MIGRATIONS_DATABASE_URL` entrypoint pattern. The backend/
  # worker/beat services connect as least-privilege neuronection_health_app.
  #
  # Re-run manually: docker compose -f docker/docker-compose.standalone.yml run --rm migrate
  # ───────────────────────────────────────────────────────────────────────
  migrate:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: health-assistant-migrate
    restart: "no"
    environment:
      <<: *backend-env
      POSTGRES_USER: neuronection_health_owner
      DATABASE_URL: postgresql+asyncpg://neuronection_health_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-neuronection_health}  # gate-allow: DATABASE_URL (live health env name — plan 23 D3 triage)
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Backend API (uvicorn)
  #
  # Does NOT run migrations (handled by `migrate` service above).
  # Isolated inside the Docker network; traffic is routed via Nginx.
  # ───────────────────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: health-assistant-backend
    restart: unless-stopped
    init: true
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY:-1G}
          cpus: "${BACKEND_CPUS:-1.0}"
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Celery Worker
  #
  # Processes background jobs: OCR, NLP extraction, notifications,
  # integration syncs, export/import, biomarker-data migration.
  # --concurrency defaults to 2 (override via CELERY_WORKER_CONCURRENCY).
  # --max-tasks-per-child recycles the worker process every N tasks to
  # release memory leaked by ML/OCR libraries.
  # ───────────────────────────────────────────────────────────────────────
  worker:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: health-assistant-worker
    restart: unless-stopped
    init: true
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      --max-tasks-per-child=${CELERY_MAX_TASKS_PER_CHILD:-100}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -t 5 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-2G}
          cpus: "${WORKER_CPUS:-2.0}"
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Celery Beat (periodic task scheduler)
  #
  # Fires scheduled tasks: cleanup_stuck_extractions (5min),
  # check_notification_triggers (60s), sync_active_integrations (60s beat;
  # per-instance sync_interval default 15min). Without this service,
  # medication reminders, recurring notifications, and auto-sync NEVER FIRE
  # in production.
  #
  # Only ONE beat instance must run — beat is not idempotent. Do NOT scale.
  # ───────────────────────────────────────────────────────────────────────
  beat:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: health-assistant-beat
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      POSTGRES_USER: neuronection_health_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://neuronection_health_app:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-neuronection_health}  # gate-allow: DATABASE_URL (live health env name — plan 23 D3 triage)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Flower (Celery monitoring UI)
  #
  # Auth REQUIRED in every flavor (audit H6): Flower exposes task payloads
  # and arguments — health data. It is protected by Flower's own basic auth
  # (FLOWER_USER / FLOWER_PASSWORD) and routed via nginx at /flower/.
  # ───────────────────────────────────────────────────────────────────────
  flower:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-backend:${IMAGE_TAG:-latest}
    container_name: health-assistant-flower
    restart: unless-stopped
    init: true
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLOWER_URL_PREFIX: /flower
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app flower
      --port=5555
      --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u ${FLOWER_USER:-admin}:${FLOWER_PASSWORD} http://localhost:5555/flower/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Frontend (Vite preview — production build)
  # Isolated inside the Docker network; traffic is routed via Nginx at /.
  # ───────────────────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${REPOSITORY:-health-assistant-io/health-assistant}/health-assistant-frontend:${IMAGE_TAG:-latest}
    container_name: health-assistant-frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    # No `command` override: the frontend image's default CMD serves the built
    # SPA on 3000 via `serve`. `npm run preview` needs the source tree +
    # package.json, which the production image intentionally does not ship.
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Nginx (Reverse Proxy)
  #
  # Routes traffic to the internal containers. Exposes only port 80/443.
  # ───────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: health-assistant-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # TLS variant (see nginx-TLS.conf + docker/README.md → TLS): swap the
      # conf mount below, provide certs, and uncomment:
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx-TLS.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - backend
      - frontend
      - flower
    logging: *default-logging
    networks:
      - health-assistant-network

  # ───────────────────────────────────────────────────────────────────────
  # Backup sidecar (deployment.md: "Backup is a service, not a ritual")
  #
  # Scheduled instance backups (pg_dump -Fc of neuronection_health + the uploads
  # volume) written to the ./backups bind mount (= docker/backups/), every
  # BACKUP_INTERVAL_HOURS, keeping BACKUP_KEEP of each. Enable with
  # --profile backup. Host-side one-shots incl. manifest + restore:
  # scripts/backup.sh + scripts/restore.sh (see docker/README.md →
  # Backup & restore drill).
  # ───────────────────────────────────────────────────────────────────────
  backup:
    image: timescale/timescaledb:latest-pg16 # pg_dump from the same image as the server
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-neuronection_health}
      POSTGRES_USER: neuronection_health_owner
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    command: >
      sh -c 'while true; do
        ts=$$(date -u +%Y%m%d-%H%M%S);
        pg_dump -h $$PGHOST -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/db-$$ts.dump;
        tar czf /backups/uploads-$$ts.tar.gz -C /uploads . || true;
        find /backups -name "db-*.dump" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        find /backups -name "uploads-*.tar.gz" | sort | head -n -$$BACKUP_KEEP | xargs -r rm --;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
      done'
    logging: *default-logging
    networks:
      - health-assistant-network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  health-assistant-network:
    driver: bridge
